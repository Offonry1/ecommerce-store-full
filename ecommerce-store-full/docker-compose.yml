version: '3.8'
services:
  db:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    ports:
      - "27017:27017"
  backend:
    build: ./backend
    environment:
      - MONGO_URL=mongodb://db:27017/ecom
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      - db
  frontend:
    working_dir: /app
    image: node:20-alpine
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
volumes:
  mongodata:
